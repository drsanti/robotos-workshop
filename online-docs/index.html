<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>robotos · Online docs</title>
    <script>
      try {
        var t = localStorage.getItem('robotos-setup-guide-theme');
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        var lang = localStorage.getItem('robotos-setup-guide-lang');
        if (lang === 'th' || lang === 'en') document.documentElement.lang = lang;
        var appearance = localStorage.getItem('robotos-setup-guide-appearance');
        if (appearance) {
          var a = JSON.parse(appearance);
          var font = a.fontFamily;
          if (
            font === 'plex' ||
            font === 'plex-looped' ||
            font === 'sarabun' ||
            font === 'noto' ||
            font === 'system'
          ) {
            document.documentElement.setAttribute('data-font', font);
          }
          if (a.textSize === 'default' || a.textSize === 'comfortable' || a.textSize === 'large') {
            document.documentElement.setAttribute('data-text-size', a.textSize);
          }
          if (a.textWeight === 'regular' || a.textWeight === 'medium') {
            document.documentElement.setAttribute('data-text-weight', a.textWeight);
          }
        } else {
          document.documentElement.setAttribute('data-font', 'plex');
          document.documentElement.setAttribute('data-text-size', 'default');
          document.documentElement.setAttribute('data-text-weight', 'regular');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-font', 'plex');
        document.documentElement.setAttribute('data-text-size', 'default');
        document.documentElement.setAttribute('data-text-weight', 'regular');
      }
    </script>
