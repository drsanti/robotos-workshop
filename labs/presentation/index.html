<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>robotos · Lab presentations</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="data.js"></script>
  <script defer src="diagrams.js"></script>
  <script defer src="lang.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="toolbar">
    <a class="brand" href="#mw-00-getting-started"><span class="brand-mark">r/</span> robotos <span class="quiet">workshop</span></a>
    <nav aria-label="Filter tracks" class="tracks">
      <button data-track="all" aria-pressed="true">All <small>24</small></button>
      <button data-track="mw" aria-pressed="false">MW <small>7</small></button>
      <button data-track="wh" aria-pressed="false">WH <small>9</small></button>
      <button data-track="hw" aria-pressed="false">HW <small>8</small></button>
    </nav>
    <div class="tools"><div class="lang" role="group" aria-label="Language"><button type="button" id="lang-en" data-lang="en" aria-pressed="true">EN</button><button type="button" id="lang-th" data-lang="th" aria-pressed="false">TH</button></div><button type="button" id="pointer-toggle" aria-expanded="false" aria-controls="pointer-panel">Pointer</button><div id="pointer-panel" class="pointer-panel" hidden><p id="pointer-title">Pointer</p><div class="pointer-colors" role="group" aria-labelledby="pointer-color-name"><span id="pointer-color-name">Color</span><button type="button" data-comet="track">Track</button><button type="button" data-comet="#8cc8e8" style="--swatch:#8cc8e8" aria-label="Ice"></button><button type="button" data-comet="#f4d35e" style="--swatch:#f4d35e" aria-label="Signal"></button><button type="button" data-comet="#ff9a5c" style="--swatch:#ff9a5c" aria-label="Copper"></button><button type="button" data-comet="#8de8b5" style="--swatch:#8de8b5" aria-label="Mint"></button><button type="button" data-comet="#ffffff" style="--swatch:#ffffff" aria-label="White"></button><label class="swatch-custom"><input id="comet-color" type="color" value="#8cc8e8" aria-label="Custom color"></label></div><label><span id="pointer-size-name">Size</span><output id="comet-size-val" for="comet-size"></output><input id="comet-size" type="range" min="0.5" max="2.5" step="0.1" value="1"></label><label><span id="pointer-length-name">Tail length</span><output id="comet-length-val" for="comet-length"></output><input id="comet-length" type="range" min="6" max="90" step="1" value="36"></label><label><span id="pointer-life-name">Tail life</span><output id="comet-life-val" for="comet-life"></output><input id="comet-life" type="range" min="80" max="1600" step="20" value="340"></label></div><button id="read">Read</button><button id="outline-toggle" aria-expanded="false" aria-controls="outline">Labs</button><button id="notes-toggle" aria-expanded="false" aria-controls="notes">Notes <kbd>N</kbd></button><button id="fullscreen" title="Toggle fullscreen (F)">Present <kbd>F</kbd></button></div>
  </header>
  <aside id="outline" class="outline" hidden>
    <label for="search">Find a lab</label><input id="search" type="search" placeholder="Title, ID or topic…" autocomplete="off">
    <nav id="lab-list" aria-label="Lab slides"></nav>
  </aside>
  <main id="main">
    <div id="slide-host"></div>
    <footer class="navigation">
      <span id="track-name" class="quiet"></span>
      <div class="page-nav"><button id="previous" aria-label="Previous slide">←</button><span id="position" role="status" aria-live="polite"></span><button id="next" aria-label="Next slide">→</button></div>
      <div><button id="export-svg">Export diagram SVG</button><button id="print">Print deck</button></div>
    </footer>
    <p class="shortcuts">← → navigate <span>·</span> Home / End <span>·</span> N notes <span>·</span> F fullscreen <span>·</span> Esc close</p>
    <section id="student-reading" class="student-reading" aria-label="Student reading, practice and procedure"></section>
  </main>
  <aside id="notes" class="notes" hidden aria-label="Presenter notes"><div class="notes-top"><h2>Presenter notes</h2><button id="notes-close" aria-label="Close presenter notes">×</button></div><div id="notes-body"></div></aside>
  <canvas id="comet" aria-hidden="true"></canvas>
  <noscript>This offline presentation requires JavaScript. The lab source documents remain available in the parent MW, WH and HW folders.</noscript>
</body>
</html>
